<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>window.__errs=[];window.addEventListener("error",e=>{window.__errs.push((e.message||"")+" @"+(e.filename||"").split("/").pop()+":"+e.lineno)},true);</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大肥鱼 · 聊天</title>
<style>
  :root{
    --night:#070f1d; --sea:#0e2744; --gold:#e5bd78; --foam:#c8ecff;
    --bubble-ai:#fdf6e8; --bubble-me:#2a5f92;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#eaf6ff;
    background:
      radial-gradient(900px 600px at 22% 12%,rgba(43,92,155,.5),transparent 60%),
      radial-gradient(700px 520px at 80% 80%,rgba(29,67,116,.45),transparent 55%),
      linear-gradient(160deg,#070f1d,#0e2744 58%,#123a5e);
    display:flex;
  }
  /* ── 舞台（Live2D） ── */
  .stage{position:relative;flex:0 0 42%;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stage canvas{display:block;max-width:100%;max-height:100%}
  .stage-glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(420px 320px at 50% 62%,rgba(120,200,255,.16),transparent 70%)}
  /* ── 聊天区 ── */
  .chat{flex:1;min-width:0;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(10,22,38,.28),rgba(8,16,28,.42));
    border-left:1px solid rgba(200,236,255,.16);
    -webkit-backdrop-filter:blur(18px) saturate(1.25);
    backdrop-filter:blur(18px) saturate(1.25)}
  .chat-head{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;
    border-bottom:1px solid rgba(200,236,255,.1)}
  .dot{width:9px;height:9px;border-radius:50%;background:#7ee2a8;box-shadow:0 0 10px #7ee2a8}
  .chat-head b{font-size:15px;font-weight:600;letter-spacing:.02em}
  .chat-head span{font-size:11.5px;color:#7fa8c6;margin-left:auto}
  .msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .msgs::-webkit-scrollbar{width:6px}
  .msgs::-webkit-scrollbar-thumb{background:rgba(200,236,255,.2);border-radius:3px}
  .msg{max-width:82%;padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.75;
    white-space:pre-wrap;word-break:break-word;animation:pop .26s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.ai{align-self:flex-start;color:#f4fbff;border-bottom-left-radius:5px;
    background:rgba(200,236,255,.14);border:1px solid rgba(200,236,255,.26);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 8px 26px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.18)}
  .msg.me{align-self:flex-end;color:#f2fbff;border-bottom-right-radius:5px;
    background:rgba(120,190,255,.2);border:1px solid rgba(180,225,255,.32);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 8px 26px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.2)}
  .msg.typing{color:#b8d6ea;background:rgba(200,236,255,.1);border:1px solid rgba(200,236,255,.2)}
  .input-bar{display:flex;gap:9px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(200,236,255,.14);
    background:rgba(8,16,28,.32);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2)}
  .input-bar input{flex:1;min-width:0;border:1px solid rgba(200,236,255,.26);background:rgba(255,255,255,.1);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:#eaf6ff;font:inherit;font-size:15px;padding:11px 15px;border-radius:13px;outline:none}
  .input-bar input:focus{border-color:rgba(200,236,255,.6)}
  .input-bar button{border:0;cursor:pointer;font:inherit;font-size:14.5px;font-weight:600;
    padding:11px 20px;border-radius:13px;background:linear-gradient(135deg,#f6dcaa,#e5bd78);color:#1a2f47;
    transition:transform .15s,filter .15s}
  .input-bar button:active{transform:scale(.96)}
  .input-bar button:disabled{filter:grayscale(.5) brightness(.8);cursor:default}
  .icon-btn{border:1px solid rgba(200,236,255,.24)!important;background:rgba(200,236,255,.1)!important;
    color:#eaf6ff!important;font-weight:400!important;padding:11px 14px!important}
  /* ── 竖屏 ── */
  @media (max-aspect-ratio: 1/1){
    body{flex-direction:column}
    .stage{flex:0 0 48%;border-bottom:1px solid rgba(200,236,255,.1)}
    .chat{border-left:0;flex:1}
    .msgs{padding:12px 14px}
    .msg{font-size:14px;max-width:88%}
    .chat-head{padding:10px 14px 8px}
  }
  @media (max-width:420px){
    .stage{flex-basis:44%}
  }
  .preview{display:none;gap:8px;padding:8px 14px;flex-wrap:wrap;border-top:1px solid rgba(200,236,255,.1);background:rgba(8,16,28,.3)}
  .preview.show{display:flex}
  .preview .thumb{position:relative;width:62px;height:62px;border-radius:10px;overflow:hidden;border:1px solid rgba(200,236,255,.3)}
  .preview .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .preview .thumb span{position:absolute;right:2px;top:2px;width:18px;height:18px;line-height:16px;text-align:center;
    border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer}
  .msg img.att.emoji{max-width:150px;max-height:150px;border-radius:12px;margin-top:8px}
  .msg img.att{margin-top:6px;max-width:100%;border-radius:10px;display:block}
  .newbtn{border:1px solid rgba(200,236,255,.35);background:rgba(200,236,255,.12);color:#dff3ff;
    font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;margin-left:8px;font-family:inherit}
  .newbtn:hover{background:rgba(200,236,255,.24)}
  .gate{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
    background:rgba(4,10,18,.82);backdrop-filter:blur(10px)}
  .gate.show{display:flex}
  .gatebox{width:min(320px,86vw);padding:26px 22px;border-radius:20px;text-align:center;
    background:rgba(200,236,255,.1);border:1px solid rgba(200,236,255,.28);
    box-shadow:0 18px 50px rgba(0,0,0,.45);color:#eaf7ff;font-family:inherit}
  .gatebox .gtitle{font-size:17px;font-weight:600;margin-bottom:16px;letter-spacing:.04em}
  .gatebox input{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;font-size:14px;
    border:1px solid rgba(200,236,255,.3);background:rgba(255,255,255,.1);color:#eaf7ff;outline:none;font-family:inherit}
  .gatebox button{margin-top:12px;width:100%;padding:11px;border:none;border-radius:12px;cursor:pointer;
    font-size:14px;font-family:inherit;background:#8fd3ff;color:#06202f;font-weight:600}
  .gerr{min-height:18px;margin-top:8px;font-size:12px;color:#ffb4b4}
  .hint{position:fixed;left:50%;top:10px;transform:translateX(-50%);font-size:12px;color:#8fb6d1;
    background:rgba(6,13,24,.6);padding:6px 14px;border-radius:20px;border:1px solid rgba(200,236,255,.15);
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
  .hint.show{opacity:1}
</style>
<script src="live2d/pixi.min.js"></script>
<script src="live2d/live2d.min.js"></script>
<script src="live2d/live2dcubismcore.min.js"></script>
<script src="live2d/cubism4.min.js"></script>
<script src="live2d/pixi-live2d.min.js"></script>
</head>
<body>
<div class="gate show" id="gate">
  <div class="gatebox">
    <div class="gtitle">🐳 大肥鱼 · 私人房间</div>
    <input id="gkey" type="password" placeholder="访问密钥" autocomplete="off">
    <button id="gbtn">进入</button>
    <div class="gerr" id="gerr"></div>
  </div>
</div>

<div class="stage" id="stage"></div>
<div class="stage-glow"></div>

<div class="chat">
  <div class="chat-head">
    <span class="dot"></span><b>大肥鱼</b><span id="status">在线</span>
    <button class="newbtn" id="newchat" title="开始新对话">＋</button>
  </div>
  <div class="msgs" id="msgs">
    <div class="msg ai">主人好呀～大肥鱼游过来啦。今天想聊点什么？</div>
  </div>
  <div class="preview" id="preview"></div>
  <div class="input-bar">
    <button class="icon-btn" id="mute" title="语音开关">🔊</button>
    <button class="icon-btn" id="attach" title="发张图">📎</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <input id="text" placeholder="和大肥鱼说点什么…（可粘贴图片）" autocomplete="off" maxlength="300">
    <button id="send">发送</button>
  </div>
</div>
<div class="hint" id="hint"></div>

<script>
(() => {
  // ═══ Live2D ═══
  const stage = document.getElementById('stage');
  const app = new PIXI.Application({
    backgroundAlpha: 0, antialias: true,
    resolution: Math.min(window.devicePixelRatio || 1, 2), autoDensity: true,
  });
  app.view.style.width = '100%';
  app.view.style.height = '100%';
  stage.appendChild(app.view);

  let model = null, lipRaf = null;
  const hint = document.getElementById('hint');
  function toast(t) {
    hint.textContent = t;
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 2200);
  }

  PIXI.live2d.Live2DModel.from('live2d/fatfish/大肥鱼.model3.json').then((m) => {
    model = m;
    window.__m = m;
    app.stage.addChild(m);
    try { m.expression('13 水印消除'); } catch (e) {}
    try { m.internalModel.coreModel.setParameterValueById('Paramcol_3', 1); } catch (e) {}
    fit();
  }).catch((e) => {
    console.error(e);
    toast('模型没加载出来：' + (e && e.message ? e.message : e));
  });

  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    app.renderer.resize(w, h);
    if (!model) return;
    // 模型原始尺寸（未缩放）用来算适配比例
    const bw = model.internalModel.width || model.width || 1000;
    const bh = model.internalModel.height || model.height || 1000;
    let s = Math.min(w / bw * 1.5, h / bh * 1.42);
    if (!isFinite(s) || s <= 0) s = 0.4;
    model.scale.set(s);
    // 顶部对齐：放大后脚下超出可视区没关系，头顶一定要露出来
    model.anchor.set(0.5, 0);
    model.x = w / 2;
    model.y = h * 0.015;
  }
  window.addEventListener('resize', () => requestAnimationFrame(fit));
  if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(stage);

  // 眨眼/呼吸由模型自带；说话时驱动嘴
  function lipSync(ms) {
    if (!model) return;
    if (lipRaf) cancelAnimationFrame(lipRaf);
    const core = model.internalModel.coreModel;
    const t0 = performance.now();
    (function step(t) {
      const p = (t - t0) / ms;
      if (p >= 1) {
        try { core.setParameterValueById('ParamMouthOpenY', 0); } catch (e) {}
        lipRaf = null; return;
      }
      const v = Math.abs(Math.sin(p * Math.PI * 8)) * (0.3 + 0.55 * Math.sin(p * Math.PI));
      try { core.setParameterValueById('ParamMouthOpenY', v); } catch (e) {}
      lipRaf = requestAnimationFrame(step);
    })(t0);
  }

  function express(name) {
    if (!model) return;
    try { model.expression(name); } catch (e) {}
  }

  // ═══ 语音 ═══
  let ttsOn = true, voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find((v) => /zh[-_]CN/i.test(v.lang)) || vs.find((v) => /^zh/i.test(v.lang)) || null;
  }
  pickVoice();
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = pickVoice;

  function speak(raw) {
    // 朗读前剥掉路径/base64/链接，只念人话
    const text = String(raw || '')
      .replace(/\[\[MEDIA:[^\]]+\]\]/g, '')
      .replace(/(?:ME?DIA):\S+/gi, '')
      .replace(/data:image\/[^\s)]+/gi, '')
      .replace(/https?:\/\/\S+/g, '')
      .replace(/[（(][^（）()]{0,30}[）)]/g, '')
      .replace(/[【\[][^【】\[\]]{0,30}[】\]]/g, '')
      .replace(/[~〜]+/g, '')
      // 只留中文、英文、数字和常用标点，颜文字残骸全部清掉
      .replace(/[^\u4e00-\u9fa5\u3000-\u303f0-9a-zA-Z，。！？、；：”‘’《》…—,.!?~\s]/g, '')
      .replace(/\s+/g, ' ').trim();
    if (!text) { lipSync(400); return; }
    if (!ttsOn || !('speechSynthesis' in window)) { lipSync(Math.min(2200, text.length * 90)); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = 0.98; u.pitch = 1.25;
      if (voice) u.voice = voice;
      u.onstart = () => lipSync(Math.max(800, Math.min(12000, text.length * 190)));
      u.onend = () => lipSync(120);
      speechSynthesis.speak(u);
    } catch (e) { lipSync(Math.min(2200, text.length * 90)); }
  }

  document.getElementById('mute').addEventListener('click', (e) => {
    ttsOn = !ttsOn;
    e.currentTarget.textContent = ttsOn ? '🔊' : '🔇';
    if (!ttsOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  });

  // ═══ 聊天 ═══
  const msgs = document.getElementById('msgs');
  const input = document.getElementById('text');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const KEY_STORE = 'fish_web_key';
  const gateEl = document.getElementById('gate');

  function apiFetch(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, {
      'X-Web-Key': localStorage.getItem(KEY_STORE) || '',
    });
    return fetch(url, opts).then((r) => {
      if (r.status === 401) { gateEl.classList.add('show'); throw new Error('unauthorized'); }
      return r;
    });
  }

  function enterGate() {
    const k = document.getElementById('gkey').value.trim();
    if (!k) return;
    fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ key: k }),
    }).then(async (r) => {
      if (r.ok) {
        localStorage.setItem(KEY_STORE, k);
        gateEl.classList.remove('show');
        document.getElementById('gerr').textContent = '';
        loadHistory();
      } else {
        const d = await r.json().catch(() => ({}));
        document.getElementById('gerr').textContent = d.error || '进不去呢';
      }
    }).catch(() => { document.getElementById('gerr').textContent = '连不上后端'; });
  }

  document.getElementById('gbtn').addEventListener('click', enterGate);
  document.getElementById('gkey').addEventListener('keydown', (e) => { if (e.key === 'Enter') enterGate(); });
  const history = [];
  let sessionId = '';
  const pending = [];   // 待发送的图片 dataURL

  const previewEl = document.getElementById('preview');
  const fileInput = document.getElementById('file');

  function renderPreview() {
    previewEl.innerHTML = '';
    pending.forEach((src, i) => {
      const d = document.createElement('div');
      d.className = 'thumb';
      d.innerHTML = '<img src="' + src + '"><span data-i="' + i + '">×</span>';
      d.querySelector('span').onclick = () => { pending.splice(i, 1); renderPreview(); };
      previewEl.appendChild(d);
    });
    previewEl.classList.toggle('show', pending.length > 0);
  }

  function shrink(fileOrBlob) {
    return new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 1280;
          let { width: w, height: h } = img;
          if (Math.max(w, h) > max) { const r = max / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.86));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(fileOrBlob);
    });
  }

  async function addFiles(list) {
    for (const f of list) {
      if (!f.type.startsWith('image/')) continue;
      if (pending.length >= 4) { toast('一次最多四张哦'); break; }
      pending.push(await shrink(f));
    }
    renderPreview();
  }

  document.getElementById('attach').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { addFiles(e.target.files); fileInput.value = ''; });
  document.addEventListener('paste', (e) => {
    const items = (e.clipboardData || {}).items || [];
    const imgs = [];
    for (const it of items) if (it.type && it.type.startsWith('image/')) imgs.push(it.getAsFile());
    if (imgs.length) { e.preventDefault(); addFiles(imgs); }
  });

  function scrub(t) {
    return String(t || '')
      .replace(/!\[[^\]]*\]\(data:image\/[^)]*\)/gi, '')
      .replace(/<img[^>]+src=["']data:image\/[^"']*["'][^>]*>/gi, '')
      .replace(/data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]{300,}/gi, '')
      .replace(/\n{3,}/g, '\n\n').trim();
  }

  function addMsg(role, text, images) {
    const d = document.createElement('div');
    d.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
    let clean = role === 'user' ? text : scrub(text);
    clean = String(clean || '').replace(/\[{0,2}(?:ME)?(?:ME?DIA):\s*\(?([^\]\s\)]+)\)?\]{0,2}/gi,
      (_, p) => '\n[[MEDIA:/media/' + encodeURIComponent(p.replace(/^.*\//, '')) + ']]\n');
    const re = /\[\[MEDIA:([^\]]+)\]\]/g;
    let last = 0, m;
    while (clean && (m = re.exec(clean))) {
      if (m.index > last) d.appendChild(document.createTextNode(clean.slice(last, m.index)));
      const im = document.createElement('img');
      im.className = 'att emoji';
      im.src = m[1];
      d.appendChild(im);
      last = m.index + m[0].length;
    }
    if (clean && last < clean.length) d.appendChild(document.createTextNode(clean.slice(last)));
    else if (clean && last === 0) d.appendChild(document.createTextNode(clean));
    (images || []).forEach((src) => {
      const im = document.createElement('img');
      im.className = 'att'; im.src = src;
      d.appendChild(im);
    });
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  // 根据回复挑表情：只在情绪明确时才换，其余保持自然
  let exprTimer = null;
  function react(text) {
    if (!model) return;
    const t = text || '';
    let name = '';
    if (/哼|讨厌|生气|过分|不理你了/.test(t) && Math.random() < 0.3) name = '03 脸黑';       // 很少用
    else if (/害羞|脸红|不好意/.test(t)) name = '04 脸红';
    else if (/呜呜|难过|舍不得|想哭|委屈|心疼/.test(t)) name = '08 担心嘴';
    else if (/流口水|馋|饿了|白饭/.test(t)) name = '07 流口水';
    else if (/惊讶|天哪|居然|真的吗|什么情况/.test(t)) name = '05 O O';
    else if (/哈|嘿|开心|高兴|笑死|好耶|太好了/.test(t) && Math.random() < 0.55) name = '02 龇牙';
    if (!name) return;                       // 没情绪就不动表情，保持自然的呼吸感
    try { model.expression(name); } catch (e) { return; }
    clearTimeout(exprTimer);
    exprTimer = setTimeout(() => { try { model.expression(); } catch (e) {} }, 4200);
  }

  async function loadHistory() {
    try {
      const r = await apiFetch('/api/session');
      const d = await r.json();
      sessionId = d.session_id || '';
      msgs.innerHTML = '';
      const list = d.messages || [];
      if (!list.length) { addMsg('ai', '主人好呀～大肥鱼游过来啦。今天想聊点什么？'); return; }
      list.forEach((m) => {
        addMsg(m.role === 'user' ? 'user' : 'ai', m.content);
        history.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content });
      });
    } catch (e) {
      addMsg('ai', '历史记录暂时读不出来，不过还是能聊天哦～');
    }
  }

  document.getElementById('newchat').addEventListener('click', async () => {
    const r = await apiFetch('/api/session/new', { method: 'POST' });
    const d = await r.json();
    if (d.session_id) {
      sessionId = d.session_id;
      history.length = 0;
      msgs.innerHTML = '';
      addMsg('ai', '新的对话开始啦，大肥鱼把前面的都忘光光咯～');
    }
  });

  async function send() {
    const text = input.value.trim();
    const imgs = pending.slice();
    if (!text && !imgs.length) return;
    input.value = '';
    pending.length = 0;
    renderPreview();
    addMsg('user', text, imgs);
    history.push({ role: 'user', content: text || '[图片]' });

    sendBtn.disabled = true;
    statusEl.textContent = '正在想…';
    const typing = addMsg('ai', '· · ·');
    typing.classList.add('typing');

    try {
      const r = await apiFetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text, images: imgs, history: history.slice(-12) }),
      });
      const data = await r.json();
      typing.remove();
      if (data.reply) {
        addMsg('ai', data.reply);
        history.push({ role: 'assistant', content: data.reply });
        react(data.reply);
        speak(data.reply);
      } else {
        addMsg('ai', '呜…大肥鱼刚才走神了，再说一次好不好？');
        toast('后端：' + (data.error || '空回复'));
      }
    } catch (e) {
      typing.remove();
      addMsg('ai', '呜…连接不到大肥鱼的小脑袋，检查一下后端在不在？');
      toast(String(e).slice(0, 80));
    } finally {
      sendBtn.disabled = false;
      statusEl.textContent = '在线';
      input.focus();
    }
  }

  if (localStorage.getItem(KEY_STORE)) {
    gateEl.classList.remove('show');
    loadHistory();
  } else {
    loadHistory();  // 没 key 会被 401 拦下，自动弹遮罩
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) send(); });
  window.addEventListener('load', () => setTimeout(fit, 120));
})();
</script>
</body>
</html>
